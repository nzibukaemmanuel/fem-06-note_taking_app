<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Notes</title>
<meta name="description" content="Choose a new password for your Notes account." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body" data-auth-page="reset-password">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 12S5.5 5.5 12 5.5 21.5 12 21.5 12 18.5 18.5 12 18.5 2.5 12 2.5 12Z" /><circle cx="12" cy="12" r="3" />
  </symbol>
  <symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3l18 18" />
    <path d="M10.6 5.6A10.8 10.8 0 0 1 12 5.5c6.5 0 9.5 6.5 9.5 6.5a13.6 13.6 0 0 1-3.1 4.1M6.6 6.6C3.9 8.3 2.5 11 2.5 12c0 0 3 6.5 9.5 6.5 1.4 0 2.6-.3 3.7-.8" />
    <path d="M9.9 10a3 3 0 0 0 4.1 4.1" />
  </symbol>
  <symbol id="icon-info-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" /><path d="M12 11v5.5" /><circle cx="12" cy="8" r="0.9" fill="currentColor" stroke="none" />
  </symbol>
  <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m15 6-6 6 6 6" />
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12.5 9.5 17 19 6.5" />
  </symbol>
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6l12 12M18 6 6 18" />
  </symbol>
</svg>
<a class="skip-link" href="#password">Skip to form</a>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand" id="brand"><svg class="brand-logo" width="95" height="28" viewBox="0 0 95 28" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Notes">
  <g clip-path="url(#auth-logo-clip0)">
    <g clip-path="url(#auth-logo-clip1)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M27.3995 2.15804C26.3677 0.192436 22.9741 0.809836 20.0411 1.59524C7.29129 6.29364 2.78049 15.8417 1.19569 21.5299C1.11729 21.6727 1.06969 21.8365 1.06549 22.0115C0.438289 24.4251 0.352889 26.0337 0.351489 26.0869C0.327689 26.6651 0.777089 27.1537 1.35529 27.1775C1.37069 27.1789 1.38609 27.1789 1.40149 27.1789C1.96009 27.1789 2.42489 26.7379 2.45009 26.1737C2.45709 26.0029 2.52149 24.8283 2.91769 23.0727C6.42889 22.9243 9.96389 21.6167 13.4359 19.1751C13.7075 18.9847 13.8727 18.6767 13.8825 18.3463C13.8923 18.0145 13.7439 17.6981 13.4849 17.4937L11.8833 16.2253L17.1389 15.7101C17.3531 15.6891 17.5547 15.6037 17.7185 15.4637C17.8319 15.3685 20.5073 13.0781 23.0525 10.4082C26.9235 6.34824 28.2633 3.80444 27.3995 2.15804Z" fill="#335CFF" />
      <path fill-rule="evenodd" clip-rule="evenodd" d="M21.1783 25.0798H12.2043C11.6247 25.0798 11.1543 25.5502 11.1543 26.1298C11.1543 26.7094 11.6247 27.1798 12.2043 27.1798H21.1783C21.7579 27.1798 22.2283 26.7094 22.2283 26.1298C22.2283 25.5502 21.7579 25.0798 21.1783 25.0798Z" fill="#335CFF" />
    </g>
  </g>
  <defs>
    <clipPath id="auth-logo-clip0"><rect width="95" height="28" fill="white" /></clipPath>
    <clipPath id="auth-logo-clip1"><rect width="28" height="28" fill="white" /></clipPath>
  </defs>
</svg></div>

    <div id="reset-form-view">
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Choose a new password for your account.</p>

      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

      <form class="auth-form" id="auth-form" novalidate>
        <div class="field">
          <label for="password">New Password</label>
          <div class="password-input">
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" aria-describedby="password-hint password-error" />
            <button type="button" class="password-toggle" id="password-toggle" aria-pressed="false" aria-label="Show password">
              <svg aria-hidden="true"><use href="#icon-eye" /></svg>
            </button>
          </div>
          <p class="field-hint" id="password-hint"><svg class="hint-icon" aria-hidden="true"><use href="#icon-info-circle" /></svg> At least 8 characters</p>
          <p class="field-error" id="password-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm New Password</label>
          <div class="password-input">
            <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" aria-describedby="confirm-password-error" />
            <button type="button" class="password-toggle" id="confirm-password-toggle" aria-pressed="false" aria-label="Show password">
              <svg aria-hidden="true"><use href="#icon-eye" /></svg>
            </button>
          </div>
          <p class="field-error" id="confirm-password-error" role="alert"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>
    </div>

    <div class="invalid-link-notice" id="invalid-link-notice" hidden>
      <p class="empty-title">This reset link is invalid or has expired</p>
      <p>Reset links only work once and expire after 15 minutes. Request a new one to continue.</p>
      <a href="forgot-password.html" class="btn btn-primary btn-block">Request a new link</a>
    </div>

    <p class="auth-footer">Remembered your password? <a href="login.html">Back to login</a></p>
  </div>
</main>

<script type="module" src="main.js"></script>
</body>
</html>
